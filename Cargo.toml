[package]
name = "otinv"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
authors = ["Londopy"]
license = "MIT"
description = "Turns passive captures from a small utility's control network into a plain-English asset inventory and a what-to-fix-first report."
homepage = "https://github.com/Londopy/otinv"
repository = "https://github.com/Londopy/otinv"
readme = "README.md"
keywords = ["ics", "ot", "scada", "zeek", "inventory"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
# only deflate: .londopy files never need the other codecs
zip = { version = "9", default-features = false, features = ["deflate"] }
# `otinv update` only, the one command that touches the network: blocking
# HTTPS with rustls and its bundled roots (no native-tls, no OpenSSL)
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11"

[profile.release]
lto = true
codegen-units = 1
strip = true

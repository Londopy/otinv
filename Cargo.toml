[package]
name = "otinv"
version = "0.3.0"
edition = "2021"
rust-version = "1.95"
authors = ["Londopy"]
license = "MIT"
description = "Turns passive captures from a small utility's control network into a plain-English asset inventory and a what-to-fix-first report."
homepage = "https://github.com/Londopy/otinv"
repository = "https://github.com/Londopy/otinv"
readme = "README.md"
keywords = ["ics", "ot", "scada", "zeek", "inventory"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
# only deflate: .londopy files never need the other codecs
zip = { version = "9", default-features = false, features = ["deflate"] }
# `otinv update` only, the one command that touches the network: blocking
# HTTPS with rustls and its bundled roots (no native-tls, no OpenSSL)
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11"
# the GUI only (otinv-gui): egui for the window, rfd for native file pickers.
# neither talks to the network
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"], optional = true }
rfd = { version = "0.18", optional = true }

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[[bin]]
name = "otinv"
path = "src/main.rs"

[[bin]]
name = "otinv-gui"
path = "src/bin/otinv-gui/main.rs"
required-features = ["gui"]

[profile.release]
lto = true
codegen-units = 1
strip = true

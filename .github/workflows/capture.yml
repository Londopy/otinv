name: Capture

# end to end through a real zeek: builds the zeek + ICSNPP image, writes the
# lab capture, and checks otinv's findings on it (tests/capture.rs). separate
# from ci.yml because building the image takes several minutes; the cache
# makes later runs fast.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "rules/**"
      - "docker/**"
      - "tests/capture.rs"
      - "tests/fixtures/make_lab_pcap.py"
      - "Cargo.*"
      - ".github/workflows/capture.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: capture-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  capture:
    name: Capture through zeek + ICSNPP
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # cache layers in GitHub's cache: compiling the ICSNPP parsers is the
      # slow part, and it only changes when the Dockerfile does
      - name: Build the zeek image
        uses: docker/build-push-action@v6
        with:
          context: docker/zeek-icsnpp
          tags: otinv-zeek:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run the capture test
        env:
          OTINV_CAPTURE_TEST: "1"
        run: cargo test --test capture -- --nocapture

      # the capture is synthetic, so zeek's raw logs are safe to keep, and
      # they are what to read when the test disagrees with real zeek
      - name: Keep zeek's logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zeek-logs
          path: /tmp/otinv-capture-test/report/zeek-logs
          if-no-files-found: ignore

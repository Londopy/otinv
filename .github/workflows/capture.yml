name: Capture

# end to end through a real zeek, every way otinv can run it:
#   docker  the zeek + ICSNPP image: the lab capture (tests/capture.rs) and
#           the public ICS captures (tests/public_traces.rs)
#   native  zeek from the project's Ubuntu packages, on PATH, with ICSNPP
#   wsl     the same zeek and ICSNPP inside WSL, driven from Windows
# separate from ci.yml because building the image takes several minutes; the
# cache makes later runs fast.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "rules/**"
      - "docker/**"
      - "tests/capture.rs"
      - "tests/public_traces.rs"
      - "tests/public-traces.txt"
      - "tests/fixtures/make_lab_pcap.py"
      - "scripts/fetch_public_traces.py"
      - "Cargo.*"
      - ".github/workflows/capture.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: capture-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  docker:
    name: Docker zeek + ICSNPP
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # cache layers in GitHub's cache: compiling the ICSNPP parsers is the
      # slow part, and it only changes when the Dockerfile does
      - name: Build the zeek image
        uses: docker/build-push-action@v7
        with:
          context: docker/zeek-icsnpp
          tags: otinv-zeek:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run the capture test
        run: cargo test --test capture -- --ignored --nocapture

      - name: Fetch the public captures
        run: python3 scripts/fetch_public_traces.py target/public-traces

      - name: Run the public capture tests
        env:
          OTINV_PUBLIC_TRACES: target/public-traces
        run: cargo test --test public_traces -- --ignored

      # the capture is synthetic, so zeek's raw logs are safe to keep, and
      # they are what to read when the test disagrees with real zeek
      - name: Keep zeek's logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zeek-logs
          path: /tmp/otinv-capture-test/report/zeek-logs
          if-no-files-found: ignore

  native:
    name: Native zeek (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install zeek
        run: |
          echo 'deb http://download.opensuse.org/repositories/security:/zeek/xUbuntu_24.04/ /' \
            | sudo tee /etc/apt/sources.list.d/security:zeek.list
          curl -fsSL --max-time 60 https://download.opensuse.org/repositories/security:zeek/xUbuntu_24.04/Release.key \
            | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/security_zeek.gpg > /dev/null
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends zeek cmake make g++ git
          echo /opt/zeek/bin >> "$GITHUB_PATH"

      # the parsers whose identity and EtherNet/IP logs the test checks;
      # their own test suites already run in the Docker image build
      - name: Install ICSNPP
        run: |
          sudo env PATH="/opt/zeek/bin:$PATH" zkg autoconfig --force
          sudo env PATH="/opt/zeek/bin:$PATH" zkg install --force --skiptests icsnpp-modbus icsnpp-dnp3 icsnpp-enip

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run the capture test
        env:
          OTINV_CAPTURE_RUNNER: native
          OTINV_CAPTURE_ICSNPP: "1"
        run: |
          zeek --version
          cargo test --test capture -- --ignored --nocapture

  wsl:
    name: Zeek in WSL (Windows)
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          set-as-default: "true"
          additional-packages: curl gpg ca-certificates

      - name: Install zeek in WSL
        shell: wsl-bash {0}
        run: |
          set -e
          echo 'deb http://download.opensuse.org/repositories/security:/zeek/xUbuntu_24.04/ /' \
            > /etc/apt/sources.list.d/security:zeek.list
          curl -fsSL --max-time 60 https://download.opensuse.org/repositories/security:zeek/xUbuntu_24.04/Release.key \
            | gpg --dearmor > /etc/apt/trusted.gpg.d/security_zeek.gpg
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends zeek cmake make g++ git
          # `wsl -e zeek` runs without a login shell, so zeek has to be on the default PATH
          ln -sf /opt/zeek/bin/zeek /usr/local/bin/zeek
          export PATH="/opt/zeek/bin:$PATH"
          zkg autoconfig --force
          zkg install --force --skiptests icsnpp-modbus icsnpp-dnp3 icsnpp-enip

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run the capture test
        env:
          OTINV_CAPTURE_RUNNER: wsl
          OTINV_CAPTURE_ICSNPP: "1"
        run: |
          wsl -e zeek --version
          cargo test --test capture -- --ignored --nocapture
